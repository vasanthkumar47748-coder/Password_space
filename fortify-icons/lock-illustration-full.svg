<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" width="800" height="720" role="img" aria-label="Secure vault illustration with lock, key, shield and password cards" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Secure vault illustration</title>
  <defs>
    <linearGradient id="gCube" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C70F5"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="gFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8E84FA"/>
      <stop offset="1" stop-color="#5B4FE8"/>
    </linearGradient>
    <linearGradient id="gBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#5B4FE8"/>
    </linearGradient>
    <linearGradient id="gShield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#4F46E5" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#4F46E5" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="180" cy="326" rx="125" ry="16" fill="#4F46E5" opacity="0.12"/>

  <!-- decorative dots -->
  <circle cx="30" cy="290" r="5" fill="#C9C5F5"/>
  <circle cx="52" cy="306" r="3" fill="#DAD7FA"/>
  <circle cx="18" cy="262" r="3" fill="#DAD7FA"/>

  <!-- top card (behind cube) -->
  <g transform="rotate(-6 275 80)" filter="url(#soft)">
    <rect x="190" y="42" width="170" height="82" rx="12" fill="#FFFFFF"/>
    <rect x="208" y="62" width="96" height="9" rx="4.5" fill="#C9C5F5"/>
    <rect x="208" y="82" width="62" height="9" rx="4.5" fill="#E3E1FA"/>
    <rect x="208" y="100" width="40" height="7" rx="3.5" fill="#EEEDFC"/>
  </g>

  <!-- cube -->
  <g transform="rotate(-4 165 200)" filter="url(#shadow)">
    <rect x="80" y="118" width="190" height="190" rx="36" fill="#3F37C9"/>
    <rect x="70" y="105" width="190" height="190" rx="36" fill="url(#gCube)"/>
    <rect x="92" y="127" width="146" height="146" rx="26" fill="url(#gFace)"/>
    <path d="M100 160 Q100 134 126 134 L170 134" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round"/>

    <!-- padlock -->
    <path d="M140 192 V172 a25 25 0 0 1 50 0 V192" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    <rect x="120" y="188" width="90" height="70" rx="16" fill="#FFFFFF"/>
    <circle cx="165" cy="216" r="9" fill="#5B4FE8"/>
    <rect x="161" y="220" width="8" height="20" rx="4" fill="#5B4FE8"/>
  </g>

  <!-- bottom-right card (in front of cube) -->
  <g transform="rotate(-5 300 274)" filter="url(#soft)">
    <rect x="225" y="236" width="150" height="80" rx="12" fill="#FFFFFF"/>
    <rect x="243" y="254" width="104" height="9" rx="4.5" fill="#C9C5F5"/>
    <circle cx="249" cy="285" r="4.5" fill="#8B84FF"/>
    <circle cx="264" cy="285" r="4.5" fill="#8B84FF"/>
    <circle cx="279" cy="285" r="4.5" fill="#8B84FF"/>
    <rect x="296" y="281" width="50" height="8" rx="4" fill="#E3E1FA"/>
  </g>

  <!-- key badge -->
  <g filter="url(#shadow)">
    <circle cx="62" cy="96" r="31" fill="url(#gBadge)" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="54" cy="104" r="9" fill="none" stroke="#FFFFFF" stroke-width="4.5"/>
    <path d="M60.5 97.5 L79 79" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M72 86 L78 92" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- shield badge -->
  <g filter="url(#shadow)">
    <path d="M258 108 L288 119 V144 C288 165 273 178 258 184 C243 178 228 165 228 144 V119 Z" fill="url(#gShield)" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
    <path d="M258 126 L273 131 V144 C273 154 266 161 258 164 C250 161 243 154 243 144 V131 Z" fill="#FFFFFF" fill-opacity="0.92"/>
  </g>
</svg>
